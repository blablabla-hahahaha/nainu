import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.8' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
    springAiVersion = '1.1.2'
    springAiAlibabaVersion = '1.1.2.2'
    mapstructVersion = '1.5.5.Final'
    r2dbcVersion = '1.0.1.RELEASE'
}

allprojects {
    group = 'nainu.top'
    version = '0.0.1-SNAPSHOT'
    description = 'Nainu AGI'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/spring/' }
        maven { url 'https://repo.spring.io/milestone' }
        mavenLocal()
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'io.projectreactor:reactor-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
            mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
            mavenBom "com.alibaba.cloud.ai:spring-ai-alibaba-bom:${springAiAlibabaVersion}"
        }
    }

    test {
        useJUnitPlatform()
    }
}

project(':nainu-agi-master') {
    apply plugin: 'org.springframework.boot'
}

project(':nainu-agi-gateway') {
    apply plugin: 'org.springframework.boot'
}

project(':nainu-agi-worker') {
    apply plugin: 'org.springframework.boot'
}

// 仅 sandbox-starter 是可执行服务；-template / -local 是普通库（约束按需引入、不背重依赖）。
project(':sandbox:nainu-agi-sandbox-starter') {
    apply plugin: 'org.springframework.boot'
}
