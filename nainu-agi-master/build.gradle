description = 'Nainu AGI Master Module'

ext {
    r2dbcVersion = '1.0.1.RELEASE'
}

dependencies {
    implementation project(':nainu-agi-common')
    // 编码（SCRIPT）节点不再内嵌脚本运行时：仅依赖契约 SDK（execute DTO + 客户端门面），执行交给独立沙箱服务。
    implementation project(':sandbox:nainu-agi-sandbox-template')

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.redisson:redisson-spring-boot-starter:3.45.1'

    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'com.alibaba.cloud.ai:spring-ai-alibaba-graph-core'
    implementation "org.postgresql:r2dbc-postgresql:$r2dbcVersion"
}

bootJar {
    enabled = true
    archiveBaseName = 'nainu-agi-master'
}

jar {
    enabled = false
}
